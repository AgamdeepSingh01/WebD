<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="mail">Enter your mail:</label>
        <input type="text" name="mail" id="mail">
        <br/>
        <br/>

        <label for="gender1">Male</label>
        <input type="radio" name="gender" id="gender1">

        <label for="gender2">Female</label>
        <input type="radio" name="gender" id="gender2">

        <label for="gender">Others</label>
        <input type="radio" name="gender" id="gender3">
        <br/>
        <br/>

        <label for="click">Click Here:</label>
        <input type="button" name="click" id="click" value="Love you">
        <br/>
        <br/>

        <label for="hindi">Hindi</label>
        <input type="checkbox" name="hindi" id="hindi">

        <label for="eng">English</label>
        <input type="checkbox" name="eng" id="eng">
        <br/>
        <br/>

        <label for="calender">Date</label>
        <input type="date" name="calender" id="calender">
        <br/>
        <br/>

        <label for="pass">Enter password:</label>
        <input type="password" name="pass" id="pass">
        <br/>
        <br/>

        <input type="image" name="pic" id="pic"  src="done.jpg" alt="Done" width="100px" height="100px">
        <br/>
        <br/>

    </form>
</body>
</html>
