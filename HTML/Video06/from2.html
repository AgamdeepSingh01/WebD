<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Job Application</h2>
    <form>
        <label for="name">Name:</label><br/>
        <input type="text" name="name" id="name">
        <br/>
        <br/>

        <label for="mail">Email:</label><br/>
        <input type="email" name="mail" id="mail">
        <br/>
        <br/>
        
        <label for="phone">Phone:</label><br/>
        <input type="tel" name="phone" id="phone">
        <br/>
        <br/>

        <label for="resume">Resume:</label><br/>
        <input type="file" name="resume" id="resume">
        <br/>
        <br/>

        <label for="experience">Experience(years):</label><br/>
        <input type="number" name="experience" id="experience" min="0" max="50">
        <br/>
        <br/>

        <fieldset>
            <legend>Skills</legend>

            <input type="checkbox" name="html" id="Html"><br/>
            <label for="Html">HTML</label>
            <br/>
            
            <input type="checkbox" name="css" id="css"><br/>
            <label for="css">CSS</label>
            <br/>
            
            <input type="checkbox" name="js" id="js"><br/>
            <label for="js">JS</label>
        </fieldset>
        <br/>

        <label for="edu">Highest Education:</label><br/>
        <select name="edu" id="edu">
            <option value="High School">High School</option>
            <option value="Undergraduate">Under Graduate</option>
            <option value="Postgraduate">Post Graduate</option>
        </select>
        <br/>
        <br/>

        <fieldset>
            <legend>Availability:</legend>

            <input type="radio" name="avail" id="full">
            <label for="full">Full Time</label>
            <br/>
            <input type="radio" name="avail" id="part">
            <label for="part">Part Time</label>
        </fieldset>
        <br/>

        <label for="comm">Additional Comments:</label><br/>
        <textarea name="comm" id="comm"></textarea>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
